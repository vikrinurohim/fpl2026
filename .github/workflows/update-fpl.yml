name: Update finalized FPL data and website

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - fpl.config.json
      - scripts/**
      - .github/workflows/update-fpl.yml

concurrency:
  group: fpl-update-and-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test finalization and score calculations
        run: node --test scripts/update-fpl.test.mjs
      - name: Fetch only finalized gameweek data
        run: node scripts/update-fpl.mjs
      - name: Save changes and prepare website
        id: changes
        shell: bash
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Update finalized FPL gameweek data'
            git push origin HEAD:main
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" != 'schedule' ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Upload website
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    if: needs.update.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish updated website
        id: deployment
        uses: actions/deploy-pages@v4
